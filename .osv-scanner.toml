reason = """braces@3.0.3 (transitive via micromatch@4.0.8 <- fast-glob/globby <- markdownlint-cli2@0.23.3, a devDependency; bun.lock). No fix available: GHSA-vfj7-8cjw-p6xm / CVE-2026-93687 (CWE-674, stack-exhaustion DoS via deeply nested brace patterns) lists first_patched_version = none for braces <= 3.0.3; npm latest is 3.0.3 and micromatch latest (4.0.8) still requires braces ^3.0.3, so no parent bump avoids it. Usage: dev/lint-only — markdownlint-cli2 expands the repository's own, developer-authored glob patterns when linting Markdown; braces is not part of the Astro build output and the deployed site is fully static (no server). Exploitability: requires deeply nested brace patterns reaching brace expansion. The only untrusted source is a fork pull request editing .markdownlint-cli2.jsonc (or another lint config) to add such a pattern, which can at most exhaust the stack of that PR's own quality-ci lint job; that run holds no secrets or write tokens and nothing is deployed from it, so this CI-only self-inflicted denial of service is accepted. Tracking: https://github.com/micromatch/braces/issues/70 and https://github.com/advisories/GHSA-vfj7-8cjw-p6xm."""
