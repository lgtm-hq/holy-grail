# OSV-Scanner configuration for holy-grail.
# Add suppressions here only when upstream fixes are unavailable and risk is accepted.

[[IgnoredVulns]]
id = "GHSA-ch52-4w7c-c8xp"
ignoreUntil = 2026-11-02
reason = """http-cache-semantics@4.2.0 (transitive via astro@7.3.4, bun.lock). No fix available: GHSA-ch52-4w7c-c8xp / CVE-2026-93748 lists first_patched_version = none; npm latest is 4.2.0 (only 4.2.0-beta.x prereleases). Usage: build-time only — astro imports it solely in dist/assets/build/remote.js for caching remote images through astro:assets; holy-grail is a fully static site (output:"static") with no astro:assets imports in src/ and no remote image configuration, so the vulnerable code path (shared cache honoring client max-stale directives) is never reachable at build time or runtime. Exploitability: none — there is no server and no shared cache. Tracking: https://github.com/kornelski/http-cache-semantics (issue #57) and GHSA-ch52-4w7c-c8xp."""

[[IgnoredVulns]]
id = "GHSA-vfj7-8cjw-p6xm"
ignoreUntil = 2026-11-02
reason = """braces@3.0.3 (transitive via micromatch, bun.lock). No fix available: GHSA-vfj7-8cjw-p6xm (CWE-674, stack-exhaustion DoS via deeply nested brace patterns) lists first_patched_version = none; npm latest is 3.0.3. Usage: build-time only — micromatch/braces expand glob patterns from our own build tooling and astro internals against trusted, developer-authored pattern strings; no attacker-controlled input reaches brace expansion (static site, no server). Exploitability: requires an attacker to supply deeply nested glob patterns, which is not possible in this build pipeline. Tracking: GHSA-vfj7-8cjw-p6xm."""
