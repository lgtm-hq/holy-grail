# Typos configuration for holy-grail.
# Identity entries below whitelist legitimate terms that the typos
# dictionary flags as misspellings. See https://github.com/crate-ci/typos

[default.extend-words]
# "UDID"/"udid" is Apple's Unique Device Identifier — a real identifier,
# distinct from a UUID. All occurrences are in the iOS/Appium guides
# (appium:udid capability key, device identifiers, tool placeholders);
# renaming them would introduce factual errors.
UDID = "UDID"
udid = "udid"
# "ba" is a sed branch label (`sed -e :a -e '...ba;'`) in
# scripts/ci/create-release-tag.sh, not a typo of "by"/"be".
ba = "ba"
# "unparseable" is a valid English variant of "unparsable", used in a
# log message in scripts/ci/security-audit.sh.
unparseable = "unparseable"
