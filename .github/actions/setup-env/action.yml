---
name: Setup Environment
description: Set up Bun and Node.js with dependency caching

inputs:
  node-version:
    description: Node.js version to use
    required: false
    default: '22.23.4'
  bun-version:
    description: Bun version to use
    required: false
    default: 'latest'
  frozen-lockfile:
    description: Enforce frozen lockfile
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}

    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: ${{ inputs.bun-version }}

    - name: Cache Bun dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: |
          ~/.bun/install/cache
          node_modules
        key: >-
          ${{ runner.os }}-bun-${{ inputs.bun-version }}-node-${{ inputs.node-version
          }}-${{ hashFiles('bun.lock', 'bun.lockb') }}
        restore-keys: |
          ${{ runner.os }}-bun-${{ inputs.bun-version }}-node-${{ inputs.node-version }}-
          ${{ runner.os }}-bun-${{ inputs.bun-version }}-
          ${{ runner.os }}-bun-

    - name: Install dependencies
      shell: bash
      env:
        FROZEN_LOCKFILE: ${{ inputs.frozen-lockfile }}
      run: ${{ github.action_path }}/../../../scripts/ci/setup-env-install.sh
