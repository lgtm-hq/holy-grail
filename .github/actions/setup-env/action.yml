---
name: Setup Environment
description: Set up Bun and Node.js with dependency caching

inputs:
  node-version:
    description: Node.js version to use
    required: false
    default: '22'
  bun-version:
    description: Bun version to use
    required: false
    default: 'latest'
  frozen-lockfile:
    description: Enforce frozen lockfile
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: ${{ inputs.bun-version }}

    - name: Cache Bun dependencies
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          ~/.bun/install/cache
          node_modules
        key: >-
          ${{ runner.os }}-bun-${{ inputs.bun-version }}-node-${{ inputs.node-version
          }}-${{ hashFiles('bun.lock', 'bun.lockb') }}
        restore-keys: |
          ${{ runner.os }}-bun-${{ inputs.bun-version }}-node-${{ inputs.node-version }}-
          ${{ runner.os }}-bun-${{ inputs.bun-version }}-
          ${{ runner.os }}-bun-

    - name: Install dependencies
      shell: bash
      run: |
        if [[ "${{ inputs.frozen-lockfile }}" == "true" ]]; then
          if [[ -f "bun.lock" ]] || [[ -f "bun.lockb" ]]; then
            bun install --frozen-lockfile
          else
            echo "Warning: frozen-lockfile requested but no lockfile found, running normal install"
            bun install
          fi
        else
          bun install
        fi
