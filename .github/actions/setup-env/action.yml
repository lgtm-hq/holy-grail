---
name: Setup Environment
description: Set up Bun and Node.js with dependency caching

inputs:
  node-version:
    description: Node.js version to use
    required: false
    default: '22.12.0'
  bun-version:
    description: Bun version to use
    required: false
    default: 'latest'
  frozen-lockfile:
    description: Enforce frozen lockfile
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
      with:
        node-version: ${{ inputs.node-version }}

    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: ${{ inputs.bun-version }}

    - name: Cache Bun dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: |
          ~/.bun/install/cache
          node_modules
        key: >-
          ${{ runner.os }}-bun-${{ inputs.bun-version }}-node-${{ inputs.node-version
          }}-${{ hashFiles('bun.lock', 'bun.lockb') }}
        restore-keys: |
          ${{ runner.os }}-bun-${{ inputs.bun-version }}-node-${{ inputs.node-version }}-
          ${{ runner.os }}-bun-${{ inputs.bun-version }}-
          ${{ runner.os }}-bun-

    - name: Install dependencies
      shell: bash
      run: |
        if [[ "${{ inputs.frozen-lockfile }}" == "true" ]]; then
          if [[ -f "bun.lock" ]] || [[ -f "bun.lockb" ]]; then
            bun install --frozen-lockfile
          else
            echo "Warning: frozen-lockfile requested but no lockfile found, running normal install"
            bun install
          fi
        else
          bun install
        fi
