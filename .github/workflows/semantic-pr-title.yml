---
name: Semantic PR Title

# semantic-title / 📝 Validate PR Title is a required status check. The
# reusable handles merge_group internally: the job always runs and every
# PR-dependent step no-ops, so the required context is satisfied in seconds
# (the title was already validated on the pull_request event).

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  merge_group:

permissions: {}

concurrency:
  group: semantic-pr-title-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  semantic-title:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-semantic-pr-title.yml@ee8484ca71db3a2c2c33da6128bbf2330fcd7c88 # v0.59.2
    with:
      job-name: '📝 Validate PR Title'
      tooling-ref: 'ee8484ca71db3a2c2c33da6128bbf2330fcd7c88'  # v0.59.2
      egress-policy: block
      egress-preset: github-tooling
    permissions:
      contents: read
      # write: post/clear marker-based failure comments (post-failure-comment default)
      pull-requests: write
