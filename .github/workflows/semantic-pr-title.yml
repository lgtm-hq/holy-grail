---
name: Semantic PR Title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  merge_group:

permissions:
  pull-requests: read

jobs:
  validate:
    name: Validate PR Title
    # amannn/action-semantic-pull-request needs PR context; on merge_group the
    # job is skipped (reported as a skipped check, which satisfies the required
    # check) — the title was already validated on the pull_request event.
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest

    steps:
      - name: Check PR title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" found in the pull request title "{title}"
            must start with a lowercase letter.

            Example: "feat: add new component" (not "feat: Add new component")
          ignoreLabels: |
            ignore-semantic-pr
