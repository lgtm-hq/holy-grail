---
name: CodeQL

# codeql / 🔬 CodeQL Analysis is a required status check, so this workflow
# must report on every PR and merge-queue entry. No on.pull_request.paths
# filter: a path-filtered workflow that does not run leaves the required
# context absent (not skipped), which permanently blocks PRs and merge-queue
# entries that touch only non-matching files (workflow-contract §
# Required-check-safe conditional workflows). The check is produced by a
# reusable-workflow caller job, so the previous detect-changes step-gating
# pattern cannot apply across the workflow_call boundary — always run on PRs
# instead (winnow/py-lintro reference-consumer pattern).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  schedule:
    # Run weekly on Sunday at 00:00 UTC
    - cron: '0 0 * * 0'

permissions: {}

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  codeql:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-codeql.yml@ee8484ca71db3a2c2c33da6128bbf2330fcd7c88 # v0.59.2
    with:
      job-name: '🔬 CodeQL Analysis'
      languages: javascript-typescript,actions
      build-mode: none
      tooling-ref: 'ee8484ca71db3a2c2c33da6128bbf2330fcd7c88'  # v0.59.2
      egress-policy: block
      egress-preset: github-tooling
      # Full list (replace semantics): the reusable passes allowed-endpoints
      # verbatim to step-security/harden-runner, so a non-empty value must
      # include the github-tooling baseline. release-assets is needed because
      # the CodeQL bundle download from github/codeql-action releases
      # redirects there (py-lintro/Rustume reference-consumer pattern).
      allowed-endpoints-mode: replace
      allowed-endpoints: >
        github.com:443
        api.github.com:443
        codeload.github.com:443
        objects.githubusercontent.com:443
        raw.githubusercontent.com:443
        uploads.github.com:443
        pipelines.actions.githubusercontent.com:443
        release-assets.githubusercontent.com:443
    permissions:
      # read: checkout repository for CodeQL analysis
      contents: read
      # write: upload CodeQL findings to the Security tab
      security-events: write
