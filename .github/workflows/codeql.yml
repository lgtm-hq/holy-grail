---
name: CodeQL

# 🔬 Analyze JavaScript/TypeScript and 🔬 Analyze GitHub Actions are required
# status checks, so this workflow must report on every PR and merge-queue
# entry. Instead of on.*.paths filters (which deadlock PRs when paths don't
# match), a `changes` job maps changed paths to filters via the lgtm-ci
# detect-changes action and the analyze jobs early-exit green when their
# paths didn't change (workflow-contract § Required-check-safe conditional
# workflows).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  schedule:
    # Run weekly on Sunday at 00:00 UTC
    - cron: '0 0 * * 0'

permissions:
  security-events: write
  contents: read

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changes: ${{ steps.detect.outputs.changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changed paths
        id: detect
        # yamllint disable-line rule:line-length
        uses: lgtm-hq/lgtm-ci/.github/actions/detect-changes@66cad82ead0e5d119928c895c7d7da9c837989e5 # v0.52.3
        with:
          filters: |
            js:
              - '**.js'
              - '**.ts'
              - '**.jsx'
              - '**.tsx'
              - '**.mjs'
              - '**.cjs'
            actions:
              - '.github/workflows/**'
              - '.github/actions/**'

  analyze-javascript:
    name: 🔬 Analyze JavaScript/TypeScript
    needs: changes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Check for source files
        id: check
        run: ./scripts/ci/check-js-source-files.sh

      - name: Initialize CodeQL
        if: >-
          steps.check.outputs.has_source == 'true'
          && fromJSON(needs.changes.outputs.changes).js
        uses: github/codeql-action/init@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        if: >-
          steps.check.outputs.has_source == 'true'
          && fromJSON(needs.changes.outputs.changes).js
        uses: github/codeql-action/analyze@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4
        with:
          category: /language:javascript-typescript

      - name: Skip notification
        if: >-
          steps.check.outputs.has_source == 'false'
          || !fromJSON(needs.changes.outputs.changes).js
        run: echo "No JavaScript/TypeScript source files or changes, skipping analysis"

  analyze-actions:
    name: 🔬 Analyze GitHub Actions
    needs: changes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        if: fromJSON(needs.changes.outputs.changes).actions
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Initialize CodeQL
        if: fromJSON(needs.changes.outputs.changes).actions
        uses: github/codeql-action/init@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4
        with:
          languages: actions
          build-mode: none

      - name: Perform CodeQL Analysis
        if: fromJSON(needs.changes.outputs.changes).actions
        uses: github/codeql-action/analyze@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4
        with:
          category: /language:actions

      - name: Skip notification
        if: '!fromJSON(needs.changes.outputs.changes).actions'
        run: echo "No workflow or action changes, skipping analysis"
