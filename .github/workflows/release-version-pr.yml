---
name: Release Version PR

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-version-pr-${{ github.repository }}
  cancel-in-progress: false

jobs:
  version-pr:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-release-version-pr.yml@39514a688ee00cdc2a82cdd13310ee1ee36b84c2 # v0.85.0
    with:
      egress-policy: block
      max-bump: minor
      ecosystems: node
      auto-merge: true
      tooling-ref: '39514a688ee00cdc2a82cdd13310ee1ee36b84c2' # v0.85.0
    secrets:
      RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
    permissions:
      contents: write
      pull-requests: write
      actions: read
      issues: write
