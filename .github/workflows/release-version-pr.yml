---
name: Release Version PR

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-version-pr-${{ github.repository }}
  cancel-in-progress: false

jobs:
  version-pr:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-release-version-pr.yml@0463233eca6eda6f9714ac0d0aa98f4a5153bd15
    with:
      max-bump: minor
      ecosystems: node
      auto-merge: true
      tooling-ref: '0463233eca6eda6f9714ac0d0aa98f4a5153bd15'
    secrets:
      RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
    permissions:
      contents: write
      pull-requests: write
      actions: read
      issues: write
