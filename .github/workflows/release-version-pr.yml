---
name: Release Version PR

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-version-pr-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  version-pr:
    name: Create Version PR
    runs-on: ubuntu-latest
    # Do not run on commits from forks
    if: github.repository_owner == github.event.repository.owner.login

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Guard release commit
        id: guard
        run: ./scripts/ci/guard-release-commit.sh

      - name: Check existing version PR
        if: steps.guard.outputs.should_skip != 'true'
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BRANCH: release/next
        run: ./scripts/ci/check-existing-version-pr.sh

      - name: Setup environment
        if: steps.guard.outputs.should_skip != 'true'
        uses: ./.github/actions/setup-env
        with:
          frozen-lockfile: 'false'

      - name: Analyze commits and bump version
        if: steps.guard.outputs.should_skip != 'true'
        id: version
        run: node scripts/ci/create-version-pr.mjs

      - name: Create or update version PR
        if: >-
          steps.guard.outputs.should_skip != 'true'
          && steps.version.outputs.bump_type != 'none'
        uses: peter-evans/create-pull-request@271a8d0340265f705b14b6d32b9829c1cb33d45e # v7
        id: create-pr
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: release/next
          delete-branch: true
          title: "chore(release): v${{ steps.version.outputs.new_version }}"
          body: |
            ## Automated Release PR

            This PR was automatically generated by the release workflow.

            **Version bump:** `${{ steps.version.outputs.bump_type }}`
            **New version:** `${{ steps.version.outputs.new_version }}`

            ### Changelog

            ${{ steps.version.outputs.changelog_entry }}

            ---

            > Merging this PR will trigger the auto-tag workflow to create a git
            > tag and GitHub release.
          commit-message: "chore(release): v${{ steps.version.outputs.new_version }} [skip ci]"
          labels: |
            release
            automated
          assignees: ${{ github.actor }}

      - name: Generate summary
        if: always() && steps.guard.outputs.should_skip != 'true'
        env:
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
          BUMP_TYPE: ${{ steps.version.outputs.bump_type }}
          PR_URL: ${{ steps.create-pr.outputs.pull-request-url }}
          PR_ACTION: >-
            ${{ steps.version.outputs.bump_type == 'none' && 'skipped' ||
            (steps.create-pr.outputs.pull-request-operation || 'created') }}
        run: ./scripts/ci/generate-version-pr-summary.sh
