---
name: Release Version PR

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-version-pr-${{ github.repository }}
  cancel-in-progress: false

jobs:
  version-pr:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-release-version-pr.yml@614c5ad1fc91d742baed959643bdd1f261a71210  # v0.79.1
    with:
      egress-policy: audit # TEMP: lgtm-hq/lgtm-ci#1207
      max-bump: minor
      ecosystems: node
      auto-merge: true
      tooling-ref: '614c5ad1fc91d742baed959643bdd1f261a71210' # v0.79.1
    secrets:
      RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
    permissions:
      contents: write
      pull-requests: write
      actions: read
      issues: write
