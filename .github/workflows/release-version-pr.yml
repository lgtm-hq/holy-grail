---
name: Release Version PR

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-version-pr-${{ github.repository }}
  cancel-in-progress: false

jobs:
  version-pr:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-release-version-pr.yml@e119ddbc8ba1fe611ed10163b2b2748d5148ab6a # v0.83.12
    with:
      egress-policy: block
      max-bump: minor
      ecosystems: node
      auto-merge: true
      tooling-ref: 'e119ddbc8ba1fe611ed10163b2b2748d5148ab6a' # v0.83.12
    secrets:
      RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
    permissions:
      contents: write
      pull-requests: write
      actions: read
      issues: write
