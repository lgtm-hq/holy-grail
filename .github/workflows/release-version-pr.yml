---
name: Release Version PR

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-version-pr-${{ github.repository }}
  cancel-in-progress: false

jobs:
  version-pr:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-release-version-pr.yml@761e2f173be08f57f0be18d8332e2b063387d987 # v0.83.9
    with:
      egress-policy: block
      max-bump: minor
      ecosystems: node
      auto-merge: true
      tooling-ref: '761e2f173be08f57f0be18d8332e2b063387d987' # v0.83.9
    secrets:
      RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
    permissions:
      contents: write
      pull-requests: write
      actions: read
      issues: write
