---
name: Release Version PR

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-version-pr-${{ github.repository }}
  cancel-in-progress: false

jobs:
  version-pr:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-release-version-pr.yml@31c25ef2e8992960e218524780e34f44f51271b5 # v0.54.0
    with:
      max-bump: minor
      ecosystems: node
      auto-merge: true
      tooling-ref: '31c25ef2e8992960e218524780e34f44f51271b5'  # v0.54.0
    secrets:
      RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
    permissions:
      contents: write
      pull-requests: write
      actions: read
      issues: write
