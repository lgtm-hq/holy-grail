---
name: Validate Action Pinning

# validate / Validate Action Pinning is a required status check, so this
# workflow must report on every PR and merge-queue entry. No
# on.pull_request.paths filter: a path-filtered workflow that does not run
# leaves the required context absent (not skipped), which permanently blocks
# PRs and merge-queue entries that touch only non-matching files
# (workflow-contract § Required-check-safe conditional workflows). The check
# is produced by a reusable-workflow caller job, so the previous
# detect-changes step-gating pattern cannot apply across the workflow_call
# boundary — always run on PRs instead.

on:
  pull_request:
  merge_group:

permissions: {}

concurrency:
  group: validate-action-pinning-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-validate-action-pinning.yml@761e2f173be08f57f0be18d8332e2b063387d987 # v0.83.9
    with:
      job-name: '📌 Validate Action Pinning'
      tooling-ref: '761e2f173be08f57f0be18d8332e2b063387d987' # v0.83.9
      egress-policy: block
      egress-preset: github-tooling
    permissions:
      # read: checkout workflow files for action pinning validation
      contents: read
