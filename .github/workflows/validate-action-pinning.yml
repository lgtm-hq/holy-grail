---
name: Validate Action Pinning

# Check SHA Pinning is a required status check, so this workflow must report
# on every PR and merge-queue entry. Instead of on.pull_request.paths (which
# deadlocks PRs when paths don't match), a `changes` job maps changed paths
# to filters via the lgtm-ci detect-changes action and the validate job
# early-exits green when no workflow or action files changed
# (workflow-contract § Required-check-safe conditional workflows).

on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: validate-action-pinning-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      changes: ${{ steps.detect.outputs.changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changed paths
        id: detect
        # yamllint disable-line rule:line-length
        uses: lgtm-hq/lgtm-ci/.github/actions/detect-changes@66cad82ead0e5d119928c895c7d7da9c837989e5 # v0.52.3
        with:
          filters: |
            actions:
              - '.github/workflows/**'
              - '.github/actions/**'

  validate:
    name: 📌 Check SHA Pinning
    needs: changes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        if: fromJSON(needs.changes.outputs.changes).actions
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Validate action pinning
        if: fromJSON(needs.changes.outputs.changes).actions
        run: scripts/ci/validate-action-pinning.sh

      - name: Skip notification
        if: '!fromJSON(needs.changes.outputs.changes).actions'
        run: echo "No workflow or action changes, skipping pinning validation"
