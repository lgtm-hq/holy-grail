---
name: Validate Action Pinning

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
  merge_group:

permissions:
  contents: read

concurrency:
  group: validate-action-pinning-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Check SHA Pinning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Validate action pinning
        run: scripts/ci/validate-action-pinning.sh
