---
name: Quality Links

on:
  schedule:
    - cron: '0 9 1 * *' # Monthly on the 1st at 9am UTC
  pull_request:
    branches: [main]
    paths:
      - 'src/content/**/*.mdx'
  workflow_dispatch:

concurrency:
  group: quality-links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-links:
    name: Check Links
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Check external links
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411 # v2.8.0
        with:
          args: >-
            --no-progress --exclude 'example\.com' --exclude 'localhost' --exclude
            '127\.0\.0\.1' --exclude 'your-app(\.|$)' --exclude 'java\.com' --exclude
            'gnu\.org' --timeout 30 --max-retries 5 --retry-wait-time 10 --accept
            '200..=204' 'src/content/**/*.mdx'
          token: ${{ secrets.GITHUB_TOKEN }}
          fail: true
