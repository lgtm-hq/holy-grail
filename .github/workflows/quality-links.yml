---
name: Quality Links

on:
  schedule:
    - cron: '0 9 1 * *' # Monthly on the 1st at 9am UTC
  pull_request:
    branches: [main]
    paths:
      - 'src/content/**/*.mdx'
  workflow_dispatch:

concurrency:
  group: quality-links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-links:
    name: Check Links
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check external links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --scheme https --scheme http --no-progress --exclude 'example\.com' --exclude 'localhost' --exclude
            '127\.0\.0\.1' --exclude 'your-app(\.|$)' --exclude 'java\.com' --exclude
            'gnu\.org' --timeout 30 --max-retries 5 --retry-wait-time 10 --accept
            '200..=204' 'src/content/**/*.mdx'
          token: ${{ secrets.GITHUB_TOKEN }}
          fail: true
