# SPDX-License-Identifier: MIT
---
name: PR - Auto Label
# Automatically applies labels to pull requests based on changed files.
# Hardens the runner via direct step-security/harden-runner invocation
# (lgtm-ci workflow-contract: egress enforcement requires the remote step).

'on':
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: "\U0001F3F7\uFE0F Auto Label PR"
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443 api.github.com:443

      - name: Apply labels based on changed files
        # yamllint disable-line rule:line-length
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          sync-labels: false
