---
name: Security - Dependency Vulnerability Scan

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  schedule:
    # Weekly scan: Monday 05:30 UTC
    - cron: '30 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

env:
  # py-lintro 0.60.2 pinned to immutable digest for reproducibility
  LINTRO_IMAGE: ghcr.io/lgtm-hq/py-lintro:0.60.2@sha256:480cd6cfc40c6ad27ec1491a208fa3111fc72c679fc3a4246762c5cbd8752175

jobs:
  security-audit:
    name: '🔐 Security Audit'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        if: ${{ !env.ACT }}
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443 api.osv.dev:443 api.deps.dev:443 github.com:443
            ghcr.io:443 objects.githubusercontent.com:443
            pkg-containers.githubusercontent.com:443 codeload.github.com:443

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Pull py-lintro Docker image
        run: ./scripts/ci/pull-lintro-image.sh

      - name: Run security audit
        id: audit
        continue-on-error: true
        run: ./scripts/ci/security-audit.sh

      - name: Upload comment artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-audit-comment
          path: security-audit-comment.txt
          if-no-files-found: error

      - name: Fail on vulnerabilities
        if: steps.audit.outcome == 'failure'
        run: ./scripts/ci/fail-audit.sh

  post-pr-comment:
    name: '💬 Post PR Comment'
    if: always() && github.event_name == 'pull_request'
    needs: security-audit
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        if: ${{ !env.ACT }}
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443 github.com:443

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download comment artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: security-audit-comment

      - name: Post PR comment
        uses: ./.github/actions/post-pr-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: security-audit-comment.txt
          marker: security-audit-report
