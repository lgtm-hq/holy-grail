# SPDX-License-Identifier: MIT
---
name: PR - Auto Assign
# Automatically assigns a random CODEOWNER to new pull requests.
# Ensures every PR has an assignee for accountability.
# Delegates to the lgtm-ci reusable workflow, which skips review
# requests on release-bump PRs (handled by the release workflow).

'on':
  pull_request_target:
    types: [opened, reopened]

permissions: {}

jobs:
  assign:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-auto-assign.yml@b0d71b2b37fd205bf12118f5084612ceeea09208 # v0.69.9
    with:
      job-name: "\U0001F464 Auto Assign CODEOWNER"
      tooling-ref: 'b0d71b2b37fd205bf12118f5084612ceeea09208' # v0.69.9
    permissions:
      contents: read
      pull-requests: write
