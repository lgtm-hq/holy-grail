# SPDX-License-Identifier: MIT
---
name: PR - Auto Assign
# Automatically assigns a random CODEOWNER to new pull requests.
# Ensures every PR has an assignee for accountability.
# Delegates to the lgtm-ci reusable workflow, which skips review
# requests on release-bump PRs (handled by the release workflow).

'on':
  pull_request_target:
    types: [opened, reopened]

permissions: {}

jobs:
  assign:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-auto-assign.yml@d1a4cbe278d60e631d95800f449d25e174140ea1  # v0.77.4
    with:
      job-name: "\U0001F464 Auto Assign CODEOWNER"
      tooling-ref: 'd1a4cbe278d60e631d95800f449d25e174140ea1' # v0.77.4
    permissions:
      contents: read
      pull-requests: write
