# SPDX-License-Identifier: MIT
---
name: PR - Auto Assign
# Automatically assigns a random CODEOWNER to new pull requests.
# Ensures every PR has an assignee for accountability.
# Delegates to the lgtm-ci reusable workflow, which skips review
# requests on release-bump PRs (handled by the release workflow).

'on':
  pull_request_target:
    types: [opened, reopened]

permissions: {}

jobs:
  assign:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-auto-assign.yml@9ea778eb4e6b876d60b7b3d7d0d0aee5182717bb  # v0.78.0
    with:
      egress-policy: audit # TEMP: lgtm-hq/lgtm-ci#1207
      job-name: "\U0001F464 Auto Assign CODEOWNER"
      tooling-ref: '9ea778eb4e6b876d60b7b3d7d0d0aee5182717bb' # v0.78.0
    permissions:
      contents: read
      pull-requests: write
