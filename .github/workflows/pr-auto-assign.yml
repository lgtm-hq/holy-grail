# SPDX-License-Identifier: MIT
---
name: PR - Auto Assign
# Automatically assigns a random CODEOWNER to new pull requests.
# Ensures every PR has an assignee for accountability.
# Delegates to the lgtm-ci reusable workflow, which skips review
# requests on release-bump PRs (handled by the release workflow).

'on':
  pull_request_target:
    types: [opened, reopened]

permissions: {}

jobs:
  assign:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-auto-assign.yml@86e29ba560701a8d73f31713eb0841ef50f6029c # v0.74.5
    with:
      job-name: "\U0001F464 Auto Assign CODEOWNER"
      tooling-ref: '86e29ba560701a8d73f31713eb0841ef50f6029c' # v0.74.5
    permissions:
      contents: read
      pull-requests: write
