# SPDX-License-Identifier: MIT
---
name: PR - Auto Assign
# Automatically assigns a random CODEOWNER to new pull requests.
# Ensures every PR has an assignee for accountability.
# Delegates to the lgtm-ci reusable workflow, which skips review
# requests on release-bump PRs (handled by the release workflow).

'on':
  pull_request_target:
    types: [opened, reopened]

permissions: {}

jobs:
  assign:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-pr-auto-assign.yml@761e2f173be08f57f0be18d8332e2b063387d987 # v0.83.9
    with:
      egress-policy: block
      job-name: "\U0001F464 Auto Assign CODEOWNER"
      tooling-ref: '761e2f173be08f57f0be18d8332e2b063387d987' # v0.83.9
    permissions:
      contents: read
      pull-requests: write
