---
name: Quality CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: quality-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-quality.yml@0de41c8e803ba2cb324dd9ec1d2e39eb870f9090
    with:
      job-name: Lint
      fail-on-error: false
    permissions:
      contents: read
      packages: read
      pull-requests: read

  lint-pr-comment:
    name: Lint PR Comment
    needs: lint
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download linting report
        id: download
        uses: actions/download-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        continue-on-error: true
        with:
          name: linting-report
          path: .

      - name: Generate PR comment
        if: steps.download.outcome == 'success'
        env:
          CHK_EXIT_CODE: ${{ needs.lint.outputs.exit-code }}
        run: ./scripts/ci/ci-pr-comment.sh

      - name: Post lintro results to PR
        if: steps.download.outcome == 'success'
        uses: ./.github/actions/post-pr-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          marker: lintro-report
          file: pr-comment.txt

      - name: Fail on linting issues
        if: needs.lint.outputs.exit-code != '0'
        run: exit 1

  build:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Check for buildable project
        id: check
        run: |
          # Check for package.json and any astro.config.* file
          has_astro_config=false
          for ext in mjs js ts mts cjs cts; do
            if [[ -f "astro.config.${ext}" ]]; then
              has_astro_config=true
              break
            fi
          done

          if [[ -f "package.json" ]] && [[ "$has_astro_config" == "true" ]]; then
            echo "has_project=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_project=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup environment
        if: steps.check.outputs.has_project == 'true'
        uses: ./.github/actions/setup-env

      - name: Type check
        if: steps.check.outputs.has_project == 'true'
        run: bun run astro check

      - name: Run unit tests
        if: steps.check.outputs.has_project == 'true'
        run: |
          if [[ -d "tests/unit" ]] && find tests/unit -name "*.test.ts" | grep -q .; then
            bun test tests/unit
          else
            echo "No unit tests found, skipping"
          fi

      - name: Build
        if: steps.check.outputs.has_project == 'true'
        run: bun run build

      - name: Upload build artifact
        if: steps.check.outputs.has_project == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: ./dist
          retention-days: 7
          if-no-files-found: ignore

      - name: Skip notification
        if: steps.check.outputs.has_project == 'false'
        run: echo "No buildable project found, skipping build steps"
