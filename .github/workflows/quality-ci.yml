---
name: Quality CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: quality-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    # Use lintro-tools image which has all external tools pre-installed
    # (shellcheck, prettier, biome, yamllint, actionlint, etc.)
    container:
      # yamllint disable-line rule:line-length
      image: ghcr.io/lgtm-hq/lintro-tools:latest@sha256:b3940578b3fa10215d2ba4accba89250753360ec6f34cebe2dc588694084dad4
      options: --user root

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Check for lintable files
        id: check
        run: |
          # Check if there are files to lint (not just CI config)
          if find . -type f \( -name "*.ts" -o -name "*.js" -o -name "*.tsx" \
                              -o -name "*.jsx" -o -name "*.py" -o -name "*.sh" \) \
             ! -path "./node_modules/*" ! -path "./.git/*" | grep -q .; then
            echo "has_code=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_code=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install lintro
        if: steps.check.outputs.has_code == 'true'
        run: uv pip install --system lintro

      - name: Run lintro
        if: steps.check.outputs.has_code == 'true'
        run: ./scripts/ci/ci-lintro.sh
        continue-on-error: true

      - name: Generate PR comment
        if:
          github.event_name == 'pull_request' && steps.check.outputs.has_code == 'true'
        run: ./scripts/ci/ci-pr-comment.sh

      - name: Post lintro results to PR
        if:
          github.event_name == 'pull_request' && steps.check.outputs.has_code == 'true'
        uses: ./.github/actions/post-pr-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          marker: lintro-report
          file: pr-comment.txt

      - name: Fail on linting issues
        if: steps.check.outputs.has_code == 'true' && env.CHK_EXIT_CODE != '0'
        run: exit 1

      - name: Skip notification
        if: steps.check.outputs.has_code == 'false'
        run: echo "No source files to lint, skipping lintro check"

  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Check for buildable project
        id: check
        run: |
          # Check for package.json and any astro.config.* file
          has_astro_config=false
          for ext in mjs js ts mts cjs cts; do
            if [[ -f "astro.config.${ext}" ]]; then
              has_astro_config=true
              break
            fi
          done

          if [[ -f "package.json" ]] && [[ "$has_astro_config" == "true" ]]; then
            echo "has_project=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_project=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup environment
        if: steps.check.outputs.has_project == 'true'
        uses: ./.github/actions/setup-env

      - name: Type check
        if: steps.check.outputs.has_project == 'true'
        run: bun run astro check

      - name: Run unit tests
        if: steps.check.outputs.has_project == 'true'
        run: |
          if [[ -d "tests/unit" ]] && find tests/unit -name "*.test.ts" | grep -q .; then
            bun test tests/unit
          else
            echo "No unit tests found, skipping"
          fi

      - name: Build
        if: steps.check.outputs.has_project == 'true'
        run: bun run build

      - name: Upload build artifact
        if: steps.check.outputs.has_project == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: ./dist
          retention-days: 7
          if-no-files-found: ignore

      - name: Skip notification
        if: steps.check.outputs.has_project == 'false'
        run: echo "No buildable project found, skipping build steps"
