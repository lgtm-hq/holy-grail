---
name: Quality CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: quality-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Run lintro
        id: lintro
        env:
          # py-lintro image pinned to specific digest for reproducibility (0.60.2)
          LINTRO_IMAGE: ghcr.io/lgtm-hq/py-lintro:0.60.2@sha256:480cd6cfc40c6ad27ec1491a208fa3111fc72c679fc3a4246762c5cbd8752175
        run: |
          set +e
          docker run --rm -v "${{ github.workspace }}:/code" \
            "$LINTRO_IMAGE" check --output-format grid 2>&1 | tee chk-output.txt
          exit_code=${PIPESTATUS[0]}
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0
        continue-on-error: true

      - name: Generate PR comment
        if: github.event_name == 'pull_request'
        env:
          CHK_EXIT_CODE: ${{ steps.lintro.outputs.exit_code }}
        run: ./scripts/ci/ci-pr-comment.sh

      - name: Post lintro results to PR
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/post-pr-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          marker: lintro-report
          file: pr-comment.txt

      - name: Fail on linting issues
        if: steps.lintro.outputs.exit_code != '0'
        run: exit 1

  build:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Check for buildable project
        id: check
        run: |
          # Check for package.json and any astro.config.* file
          has_astro_config=false
          for ext in mjs js ts mts cjs cts; do
            if [[ -f "astro.config.${ext}" ]]; then
              has_astro_config=true
              break
            fi
          done

          if [[ -f "package.json" ]] && [[ "$has_astro_config" == "true" ]]; then
            echo "has_project=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_project=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup environment
        if: steps.check.outputs.has_project == 'true'
        uses: ./.github/actions/setup-env

      - name: Type check
        if: steps.check.outputs.has_project == 'true'
        run: bun run astro check

      - name: Run unit tests
        if: steps.check.outputs.has_project == 'true'
        run: |
          if [[ -d "tests/unit" ]] && find tests/unit -name "*.test.ts" | grep -q .; then
            bun test tests/unit
          else
            echo "No unit tests found, skipping"
          fi

      - name: Build
        if: steps.check.outputs.has_project == 'true'
        run: bun run build

      - name: Upload build artifact
        if: steps.check.outputs.has_project == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: ./dist
          retention-days: 7
          if-no-files-found: ignore

      - name: Skip notification
        if: steps.check.outputs.has_project == 'false'
        run: echo "No buildable project found, skipping build steps"
