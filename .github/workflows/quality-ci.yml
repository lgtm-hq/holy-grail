---
name: Quality CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

concurrency:
  group: quality-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-quality-lint.yml@39514a688ee00cdc2a82cdd13310ee1ee36b84c2 # v0.85.0
    with:
      egress-policy: block
      job-name: '🛠️ Lintro Code Quality'
      tooling-ref: '39514a688ee00cdc2a82cdd13310ee1ee36b84c2' # v0.85.0
    permissions:
      contents: read
      packages: read

  publish-quality-summary:
    needs: quality
    if: >-
      !cancelled()
      && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.fork == false
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-publish-quality-summary.yml@39514a688ee00cdc2a82cdd13310ee1ee36b84c2 # v0.85.0
    with:
      egress-policy: block
      exit-code: ${{ needs.quality.outputs.exit-code }}
      tooling-ref: '39514a688ee00cdc2a82cdd13310ee1ee36b84c2' # v0.85.0
    permissions:
      contents: read
      pull-requests: write

  build:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-build-artifact.yml@39514a688ee00cdc2a82cdd13310ee1ee36b84c2 # v0.85.0
    with:
      egress-policy: block
      job-name: '🏗️ Build & Test'
      build-command: bash scripts/ci/build-site.sh
      node-version: '22.23.4'
      artifact-name: site-dist
      artifact-path: dist
      tooling-ref: '39514a688ee00cdc2a82cdd13310ee1ee36b84c2' # v0.85.0
    permissions:
      contents: read
