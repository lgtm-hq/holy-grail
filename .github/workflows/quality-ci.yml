---
name: Quality CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

concurrency:
  group: quality-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-quality-lint.yml@31c25ef2e8992960e218524780e34f44f51271b5 # v0.54.0
    with:
      job-name: '🛠️ Lintro Code Quality'
      tooling-ref: '31c25ef2e8992960e218524780e34f44f51271b5'  # v0.54.0
    permissions:
      contents: read
      packages: read

  publish-quality-summary:
    needs: quality
    if: >-
      !cancelled()
      && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.fork == false
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-publish-quality-summary.yml@31c25ef2e8992960e218524780e34f44f51271b5 # v0.54.0
    with:
      exit-code: ${{ needs.quality.outputs.exit-code }}
      tooling-ref: '31c25ef2e8992960e218524780e34f44f51271b5'  # v0.54.0
    permissions:
      contents: read
      pull-requests: write

  build:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-build-artifact.yml@443a687caa93b3afa306a066aae8d8a2b4e60c3c # v0.59.0
    with:
      job-name: '🏗️ Build & Test'
      build-command: bash scripts/ci/build-site.sh
      node-version: '22.12.0'
      artifact-name: site-dist
      artifact-path: dist
      tooling-ref: '443a687caa93b3afa306a066aae8d8a2b4e60c3c'  # v0.59.0
    permissions:
      contents: read
