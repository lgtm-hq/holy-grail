---
name: Quality CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: quality-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    container:
      # SHA-pinned lintro tools image with all linters pre-installed
      image: ghcr.io/lgtm-hq/lintro-tools:latest@sha256:b3940578b3fa10215d2ba4accba89250753360ec6f34cebe2dc588694084dad4

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Run lintro
        run: /usr/local/bin/lintro chk

  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Type check
        run: |
          if [[ -f "astro.config.mjs" ]]; then
            bun run astro check
          else
            echo "No Astro config found, skipping type check"
          fi

      - name: Run unit tests
        run: |
          if [[ -d "tests/unit" ]]; then
            bun test tests/unit
          else
            echo "No unit tests found, skipping"
          fi

      - name: Build
        run: |
          if [[ -f "package.json" ]]; then
            bun run build
          else
            echo "No package.json found, skipping build"
          fi

      - name: Upload build artifact
        if: hashFiles('dist/**') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: ./dist
          retention-days: 7
