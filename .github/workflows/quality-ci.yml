---
name: Quality CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: quality-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-quality.yml@79444626c1b3afa4d959b5840b4b5310a46a4095
    with:
      tooling-ref: '79444626c1b3afa4d959b5840b4b5310a46a4095'
    permissions:
      contents: read
      packages: read
      pull-requests: write

  build:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Check for buildable project
        id: check
        run: bash scripts/ci/detect-buildable-project.sh

      - name: Setup environment
        if: steps.check.outputs.has_project == 'true'
        uses: ./.github/actions/setup-env

      - name: Type check
        if: steps.check.outputs.has_project == 'true'
        run: bun run astro check

      - name: Run unit tests
        if: steps.check.outputs.has_project == 'true'
        run: bash scripts/ci/run-unit-tests-if-present.sh

      - name: Build
        if: steps.check.outputs.has_project == 'true'
        run: bun run build

      - name: Upload build artifact
        if: steps.check.outputs.has_project == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: ./dist
          retention-days: 7
          if-no-files-found: ignore
