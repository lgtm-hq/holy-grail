---
name: Quality CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: quality-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # Pin until lgtm-ci #147 + #160 are on main (docker reusable + job-name input)
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-quality.yml@95b4ce2ef52eb6fd9322765d18535f3c04e95ec3
    with:
      job-name: Lint
      fail-on-error: false
    permissions:
      contents: read
      packages: read
      pull-requests: read

  lint-pr-comment:
    name: Lint PR Comment
    needs: lint
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Download linting report
        id: download
        uses: actions/download-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        continue-on-error: true
        with:
          name: linting-report
          path: .

      - name: Generate PR comment
        if: steps.download.outcome == 'success'
        env:
          CHK_EXIT_CODE: ${{ needs.lint.outputs.exit-code }}
        run: ./scripts/ci/ci-pr-comment.sh

      - name: Post lintro results to PR
        if: steps.download.outcome == 'success'
        uses: ./.github/actions/post-pr-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          marker: lintro-report
          file: pr-comment.txt

      - name: Fail on linting issues
        if: needs.lint.outputs.exit-code != '0'
        run: bash scripts/ci/fail-on-lint-issues.sh

  build:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Check for buildable project
        id: check
        run: bash scripts/ci/detect-buildable-project.sh

      - name: Setup environment
        if: steps.check.outputs.has_project == 'true'
        uses: ./.github/actions/setup-env

      - name: Type check
        if: steps.check.outputs.has_project == 'true'
        run: bun run astro check

      - name: Run unit tests
        if: steps.check.outputs.has_project == 'true'
        run: bash scripts/ci/run-unit-tests-if-present.sh

      - name: Build
        if: steps.check.outputs.has_project == 'true'
        run: bun run build

      - name: Upload build artifact
        if: steps.check.outputs.has_project == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: ./dist
          retention-days: 7
          if-no-files-found: ignore

      - name: Skip notification
        if: steps.check.outputs.has_project == 'false'
        run: echo "No buildable project found, skipping build steps"
