---
name: Quality E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

concurrency:
  group: quality-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-test-e2e-playwright.yml@443a687caa93b3afa306a066aae8d8a2b4e60c3c # v0.59.0
    with:
      job-name: '🎭 E2E Tests'
      package-manager: bun
      node-version: '22.12.0'
      browsers: chromium
      project: chromium
      # Astro preview (playwright.config.ts webServer) needs dist/, so build first.
      test-command: 'bun run build && bunx playwright test'
      publish-test-summary: true
      tooling-ref: '443a687caa93b3afa306a066aae8d8a2b4e60c3c'  # v0.59.0
    permissions:
      contents: read
      pull-requests: write
