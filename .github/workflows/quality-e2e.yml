---
name: Quality E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: quality-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Check for E2E test setup
        id: check
        run: |
          if [[ -f "playwright.config.ts" ]] && [[ -f "package.json" ]]; then
            echo "has_e2e=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_e2e=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup environment
        if: steps.check.outputs.has_e2e == 'true'
        uses: ./.github/actions/setup-env

      - name: Install Playwright
        if: steps.check.outputs.has_e2e == 'true'
        run: bunx playwright install --with-deps chromium

      - name: Build site
        if: steps.check.outputs.has_e2e == 'true'
        run: bun run build

      - name: Run Playwright tests
        if: steps.check.outputs.has_e2e == 'true'
        id: playwright
        run: |
          # Run tests and capture exit code
          set +e
          bunx playwright test --project=chromium --reporter=json,html \
            2>&1 | tee playwright-output.txt
          exit_code=${PIPESTATUS[0]}
          set -e

          # Parse results for summary
          if [[ -f playwright-report/index.html ]]; then
            echo "report_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "report_exists=false" >> "$GITHUB_OUTPUT"
          fi

          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit "$exit_code"
        continue-on-error: true

      - name: Generate test summary
        id: summary
        if: steps.check.outputs.has_e2e == 'true' && always()
        run: |
          scripts/ci/generate-playwright-comment.sh > comment.md
          {
            echo 'comment<<EOF'
            cat comment.md
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Post PR comment
        # Skip for forked PRs (GITHUB_TOKEN is read-only)
        if: >-
          steps.check.outputs.has_e2e == 'true' && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.fork != true && always()
        uses: ./.github/actions/post-pr-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          marker: playwright-e2e-results
          body: ${{ steps.summary.outputs.comment }}

      - name: Upload Playwright report
        if: steps.check.outputs.has_e2e == 'true' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Fail if tests failed
        if: >-
          steps.check.outputs.has_e2e == 'true' && steps.playwright.outputs.exit_code !=
          '0'
        run: exit 1

      - name: Skip notification
        if: steps.check.outputs.has_e2e == 'false'
        run: echo "No E2E test setup found, skipping Playwright tests"
