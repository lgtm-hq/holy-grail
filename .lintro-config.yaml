---
# Lintro Configuration
# https://github.com/lgtm-hq/py-lintro
#
# Lintro is the master configuration source for all tools.
# Native tool configs (.prettierrc, .yamllint, etc.) are used when available.

enforce:
  line_length: 88

execution:
  enabled_tools: []
  tool_order: 'priority'
  fail_fast: false

# Fallback configurations for tools without native config files.
# These are used when no native config (e.g., .prettierrc, .yamllint) is found.
defaults:
  prettier:
    semi: true
    singleQuote: true
    tabWidth: 2
    printWidth: 88
    trailingComma: 'es5'

  markdownlint:
    MD013:
      line_length: 88
      code_blocks: false
      tables: false

  yamllint:
    extends: 'default'
    rules:
      comments-indentation: 'disable'
      comments:
        min-spaces-from-content: 1
      truthy:
        check-keys: true
      line-length:
        max: 88
        allow-non-breakable-inline-mappings: true

  hadolint:
    ignored: []
    trusted_registries:
      - 'docker.io'
      - 'gcr.io'
      - 'ghcr.io'
      - 'quay.io'
      - 'registry.hub.docker.com'

  mypy:
    strict: true
    ignore_missing_imports: true

# Tool enable/disable settings.
# Full tool configs are in native files (pyproject.toml, etc.)
# or in the defaults section above.
tools:
  # Astro check - disabled: the py-lintro image bundles a global Astro that
  # mismatches this project's Astro/MDX majors and crashes astro-check.
  # Type checking is covered by `bun run astro check` in the Build & Test job.
  astro-check:
    enabled: false

  # Ruff - Python linter and formatter (config in pyproject.toml [tool.ruff])
  ruff:
    enabled: true

  # Black - Python formatter (uses enforce.line_length)
  black:
    enabled: true

  # Prettier - Multi-language formatter (defaults above or .prettierrc)
  prettier:
    enabled: true

  # Pylint - disabled: lintro 0.147.x bundles pylint, which scans the vendored
  # lgtm-ci tooling scripts (scripts/ci/**) and flags pre-existing script
  # conventions (C0103 hyphenated CLI names, W1514 open-encoding, C0116
  # docstrings). That catalogue is gated upstream in lgtm-ci's own repo
  # (duplicate-code ratchet landed in lgtm-ci#930).
  pylint:
    enabled: false

  # Markdownlint - Markdown linter (defaults above or .markdownlint.yaml)
  markdownlint:
    enabled: true
    exclude:
      - '.lintro/**'

  # Yamllint - YAML linter (defaults above or .yamllint)
  yamllint:
    enabled: true
    config_source: '.yamllint'

  # Bandit - Security linter (config in pyproject.toml [tool.bandit])
  bandit:
    enabled: true

  # Hadolint - Dockerfile linter (defaults above or .hadolint.yaml)
  hadolint:
    enabled: true

  # Actionlint - GitHub Actions linter
  actionlint:
    enabled: true

  # Pydoclint - Python docstring linter
  pydoclint:
    enabled: true

  # Mypy - Python type checker
  mypy:
    enabled: true

  # TypeScript compiler for type checking
  tsc:
    enabled: true

  # Shellcheck - Shell script linter
  shellcheck:
    enabled: true

  # Shfmt - Shell script formatter
  shfmt:
    enabled: true

  # Gitleaks - Secret scanner
  gitleaks:
    enabled: true

  # Semgrep - Static analysis
  semgrep:
    enabled: true

  # Taplo - TOML formatter
  taplo:
    enabled: true

  # SQLFluff - SQL linter
  sqlfluff:
    enabled: true

  # Clippy - Rust linter
  clippy:
    enabled: true

  # Rustfmt - Rust formatter
  rustfmt:
    enabled: true

  # Cargo audit - Rust security audit
  cargo_audit:
    enabled: true

  # Pytest - Test runner
  pytest:
    enabled: true
