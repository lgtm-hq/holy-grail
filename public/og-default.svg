<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e2e"/>
      <stop offset="100%" style="stop-color:#11111b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f9e2af"/>
      <stop offset="50%" style="stop-color:#f5c97f"/>
      <stop offset="100%" style="stop-color:#f9e2af"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative border -->
  <rect x="20" y="20" width="1160" height="590" fill="none" stroke="url(#gold)" stroke-width="2" rx="10"/>

  <!-- Trophy icon -->
  <text x="600" y="250" text-anchor="middle" font-size="120" fill="url(#gold)">🏆</text>

  <!-- Title -->
  <text x="600" y="380" text-anchor="middle" font-family="serif" font-size="72" font-weight="700" fill="url(#gold)">Holy Grail</text>

  <!-- Tagline -->
  <text x="600" y="450" text-anchor="middle" font-family="sans-serif" font-size="28" fill="#cdd6f4">The quest for the perfect dev environment</text>

  <!-- URL -->
  <text x="600" y="560" text-anchor="middle" font-family="monospace" font-size="20" fill="#6c7086">lgtm-hq.github.io/holy-grail</text>
</svg>
